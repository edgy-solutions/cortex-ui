worker_processes auto;
error_log /dev/stderr notice;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;

  # Silence logs for health probes to avoid cluttering the logs
  map $http_user_agent $loggable {
    ~*kube-probe  0;
    default       1;
  }

  access_log /dev/stdout combined if=$loggable;

  server {
    listen       8080;
    root         /usr/share/nginx/html;
    index        index.html;

    # Security headers (server-level default; re-declared inside any location
    # that adds its OWN add_header, because nginx add_header does NOT inherit
    # once a location defines any add_header of its own).
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;

    # SPA routing — fallback to index.html. index.html MUST NOT be cached
    # immutably: it names the current hashed bundle, so a stale index.html
    # pins the browser to an OLD bundle across deploys (Ctrl-R reuses it and
    # never loads new code — the "fix deployed but browser never sees it" bug).
    # no-cache = the browser may store it but MUST revalidate every load, so a
    # new deploy is picked up immediately (304 when unchanged, fresh when not).
    location / {
      try_files $uri $uri/ /index.html;
      add_header Cache-Control "no-cache";
      add_header X-Content-Type-Options nosniff;
      add_header X-Frame-Options DENY;
    }

    # Immutable hashed assets — safe to cache forever (the hash changes on any
    # content change, so a new deploy references new filenames).
    location /assets/ {
      expires    1y;
      add_header Cache-Control "public, immutable";
      add_header X-Content-Type-Options nosniff;
      add_header X-Frame-Options DENY;
    }
  }
}
