# ──────────────────────────────────────────────────────────
# Release Helm Charts
# ──────────────────────────────────────────────────────────
# Automatically packages the Helm chart, creates a GitHub Release
# with the .tgz asset, and updates the index.yaml on the gh-pages branch.
#
# Requirements:
# 1. Enable GitHub Pages in your repository settings and set the
#    source to the "gh-pages" branch.
# 2. Ensure GitHub Actions has Read & Write permissions for the repo.

name: Release Helm Charts

on:
  push:
    branches:
      - master
    paths:
      - "helm/**"
      # The chart's own checks. A change to a guard must run that guard and its redproof, or an
      # edit that silently disarms one lands on master unmeasured. chart-releaser itself runs only
      # when Chart.yaml's version is not yet in the gh-pages index (see "Is this chart version
      # already published?" below); cr on its own packages any chart with a changed file.
      - "scripts/check-chart-renders.mjs"
      - "scripts/redproof-chart-*.mjs"
      - ".github/workflows/helm-release.yml"

jobs:
  release:
    # Depending on default settings, these permissions might be required
    permissions:
      contents: write
      pages: write

    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # ⛔ THE ONLY PLACE IN CI THAT RENDERS THIS CHART.
      #
      # chart-releaser PACKAGES the chart; `helm package` does not template it. So until these steps
      # existed, no job in this repo had ever rendered helm/cortex-ui — which is exactly how
      # `tag: latest` survived as the default in values.yaml with nothing to object, and how a
      # never-built tag would have rendered perfectly and failed minutes later at the kubelet on a
      # release Helm had already called a success.
      #
      # All three run BEFORE chart-releaser on purpose: a chart that cannot render, or whose
      # image-pin guard has stopped refusing, must not be published. The scripts need only node
      # builtins and helm, so there is deliberately no `npm ci` here — a dependency install is
      # another way for this to stop running for a reason that has nothing to do with the chart.

      # ⛔ FIRST: does it render for a CALLER — the pin and nothing else? cortex-ui-0.2.0 was
      # published unable to render at all (a template read .Values.invincibleAgent.*, never
      # declared), while the pin redproof below stayed green by passing those values itself. A
      # fixture that reaches further than the artifact cannot report that the artifact is broken.
      - name: The chart renders for a caller who supplies only the image pin
        run: node scripts/check-chart-renders.mjs
      - name: Prove that render check can still fail, each time for its own reason
        run: node scripts/redproof-chart-renders.mjs
      - name: Prove the chart can still refuse a bad image pin
        run: node scripts/redproof-chart-image-pin.mjs
      # ⛔ The CHART line and the APP line no longer share tag names (architect, 2026-11-24).
      # App releases are `cortex-ui-x.y.z`, cut at the commit an iagent release pins, and hold
      # Latest. Chart releases are `chart-cortex-ui-x.y.z` (.github/cr.yaml) and never take Latest.
      # Past chart releases (cortex-ui-0.1.0 … 0.3.0) keep their names; their index URLs are absolute.
      #
      # Why the guard: cr diffs helm/ against the NEAREST tag of any kind (`git describe --tags
      # HEAD~`) and packages any chart with a changed file, whether or not its version moved.
      # Before the rename, an unbumped edit failed loudly on the existing release name. After it,
      # the same edit would publish a SECOND copy of an already-published version under the new
      # name. The .tgz file name is `<name>-<version>.tgz` under either template, so the index is
      # asked by file name.
      - name: Is this chart version already published?
        id: published
        run: |
          set -euo pipefail
          V=$(sed -n 's/^version:[[:space:]]*//p' helm/cortex-ui/Chart.yaml | tr -d "\"' \r")
          [ -n "$V" ] || { echo "::error::no version: in helm/cortex-ui/Chart.yaml"; exit 1; }
          git fetch --no-tags origin gh-pages
          INDEX=$(git show FETCH_HEAD:index.yaml)
          # Control: a version that is published must be found, or this check cannot tell.
          grep -qF "/cortex-ui-0.3.0.tgz" <<<"$INDEX" || { echo "::error::control cortex-ui-0.3.0.tgz not found in index.yaml: this check cannot see the index"; exit 1; }
          if grep -qF "/cortex-ui-$V.tgz" <<<"$INDEX"; then
            echo "::notice::chart $V is already in the gh-pages index; chart-releaser skipped. Bump helm/cortex-ui/Chart.yaml version to publish a chart change."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "chart $V is not in the index: releasing it as chart-cortex-ui-$V"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Run chart-releaser
        if: steps.published.outputs.skip == 'false'
        uses: helm/chart-releaser-action@v1.6.0
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        with:
          charts_dir: helm
          config: .github/cr.yaml
          mark_as_latest: false
