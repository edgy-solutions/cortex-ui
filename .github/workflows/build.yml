# ──────────────────────────────────────────────────────────
# The Cortex — Build & Push Container Images (Buildpacks)
# ──────────────────────────────────────────────────────────
# Triggers on push to main or any tag starting with 'v'.
# Builds the cortex-frontend image using Cloud Native Buildpacks (pack CLI):
# Pushes to GitHub Container Registry (ghcr.io).

name: Build Containers

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}
  # ⛔ THE PRODUCER SHA, DECLARED ONCE. It is needed in two places — the checkout `ref` and the
  # env the seal reads to print its baseline — and carrying it twice is the same
  # two-declarations-of-one-fact defect this repo found three times today, once in its own type
  # system. Two literals that must agree, with nothing checking that they do, is how the seal
  # ends up measuring one producer and REPORTING another.
  #
  # Bump HERE and nowhere else.
  PRODUCER_REF: cfa3f0d26aa75b4a203d599b62f4471144294cc6

permissions:
  contents: read
  packages: write

jobs:
  # ── Frontend ──────────────────────────────────────────────
  frontend:
    name: Build Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── THE GATE LIVES HERE, NOT IN THE CONTAINER ──────────────────────
      #
      # The task-kind parity seal compares cortex's rendering against the PRODUCER's declared
      # task kinds, which means it needs two repos on one filesystem. `docker build` gets one
      # (`COPY . .`), which is the point of a hermetic context — so the seal could never run
      # there, and when a skipped seal was correctly made red, no image could be built at all.
      #
      # ⛔ AND IT HAD NEVER RUN IN CI. A single `actions/checkout` meant the producer was absent
      # on every build since the seal landed, so all 28 parity assertions silently skipped and
      # every green build appeared to carry coverage it did not have. The red that broke the
      # image did not introduce that; it revealed it, in the only place loud enough to notice.
      #
      # So the producer is checked out BESIDE cortex-ui and the suite runs in this job.
      - name: Check out the producer beside cortex-ui
        uses: actions/checkout@v4
        with:
          repository: edgy-solutions/invincible-agent
          # PINNED, AND THE SEAL PRINTS IT. A moving `master` makes a parity red
          # unattributable — nobody can tell whether cortex changed or the producer did. Pinned
          # to the sha THE FLEET IS ACTUALLY SERVING, read off the deployed image tag
          # (`ghcr.io/.../cortex-bff:9ede76c…`) rather than from anyone's branch, because merged
          # and served are different facts and this seal is about the deployed contract.
          #
          # ⛔ WHICH COMPONENT'S SHA THIS IS, because the producer repo is deployed at MORE THAN
          # ONE at a time. Measured 2026-09-15 in the sandbox:
          #
          #   iagent-cortex-bff   cortex-bff:cfa3f0d…   serves the DECLARATIONS this seal reads
          #   iagent-projector    cortex-bff:cfa3f0d…   writes answer_artifact_projection
          #
          # BOTH PRODUCERS ARE BACK ON ONE SHA and the fleet is FROZEN at it, so this pin is
          # stable rather than merely current. Measured from the pods 2026-09-17.
          #
          # The bump also ARMS R-073: `unsummarised` exists on both sides only at cfa3f0d or
          # later, so `dispositionJoin.test.ts` — the term's retirement mechanism — could not
          # land until this moved. It lands with it, which is what the ruling asked for.
          #
          # THE OPEN QUESTION THIS MAKES LIVE — do not resolve it by bumping. The seal reads
          # `policy/task_kinds`, which the BFF serves, so on one reading the pin should follow the
          # bff and be ca3a38f today. But a seal over artifact FIELDS would belong to the
          # PROJECTOR, still at 3830de1. Bumping now would quietly settle "this pin means the
          # task-kind producer" without anyone having decided it, so it stays put until someone
          # does.
          #
          # HELD SAFELY, AND THAT IS MEASURED RATHER THAN ASSUMED: `git diff 3830de1 ca3a38f`
          # touches five files — direct_dispatch.py, gateway.py, graph_host/main.py and two
          # tests — and NOTHING under `policy/task_kinds` or the sample overlay. So the seal's
          # result is identical either way.
          #
          # ⛔ AND THE EARLIER "they agree" NOTE HAS NOW BEEN ASKED ITS QUESTION AND HELD BY
          # CONTENT, NOT BY THE PODS AGREEING. It was recorded as a coincidence precisely because
          # correct-by-accident and correct-by-construction read identically at the moment you
          # look. The pods have since diverged and the seal is still right — which is the
          # coincidence holding for a DIFFERENT reason than the one that made it look safe.
          # If a future bff roll touches the declarations, this stops being free and the pin's
          # meaning must be decided before it is moved.
          #
          # HISTORY: they were also split when this pin was first set — bff at 9ede76c,
          # seventeen other services at 280e6103 — and the producer lane's own pre-roll census
          # exited 1 over it, flagging the bff as AHEAD of record. The 2026-09-15 roll pinned
          # everything via `global.imageTag` and closed that one.
          #
          # One repo, two live versions, and "the producer" names neither on its own. The
          # projector is the one that writes `answer_artifact_projection`, which is what cortex
          # consumes over Electric, so for ARTIFACT SHAPE it is arguably the more relevant half.
          # The pin follows the BFF because the task-kind declarations this seal reads are served
          # by it. The two currently agree on `policy/task_kinds` and the sample overlay — a
          # `git diff` between them over those paths is EMPTY — so the choice does not change the
          # result today. That is a coincidence and not a guarantee: if they diverge, this pin
          # must name which contract is being sealed rather than silently tracking one.
          #
          # NOT THE FRONTEND. cortex-ui's own deployment is `frontend:latest` with pullPolicy
          # Always and carries no sha tag — a real gap, but a different one, and it is already
          # closed by the served bundle self-reporting `git_sha` in /version.json rather than by
          # anything here.
          #
          # Bump this deliberately, with the new sha measured from the POD the same way. A parity
          # red after a bump is a real finding about drift between the two repos; it is not a
          # flake and must not be retried away.
          ref: ${{ env.PRODUCER_REF }}
          path: _producer
          persist-credentials: false

      # `actions/checkout` refuses any `path` outside GITHUB_WORKSPACE, and the seal resolves
      # the producer as a SIBLING of the cortex-ui checkout root. So it lands in-workspace and is
      # moved one level up. The seal needs only `policy/task_kinds` and the sample overlay — no
      # git history — so a plain move is sufficient.
      - name: Put the producer where the seal looks for it
        run: |
          set -euo pipefail
          mv _producer ../invincible-agent

          # ⛔ ASSERT THE BASELINE, because a GREEN RUN OTHERWISE PROVES NOTHING ABOUT IT. The
          # seal names its producer only in an assertion MESSAGE, which appears on failure — so
          # if `PRODUCER_REF` ever resolved to empty, checkout would silently fall back to the
          # default branch, the counts below would still print, the suite would still pass, and
          # the seal would be measuring master while this file claimed a pin. That is the same
          # "measures one producer, reports another" failure as two literals drifting, reached
          # through a different door: a claim nothing could contradict.
          ACTUAL="$(git -C ../invincible-agent rev-parse HEAD)"
          echo "producer HEAD: $ACTUAL"
          echo "pinned ref:    $PRODUCER_REF"
          if [ "$ACTUAL" != "$PRODUCER_REF" ]; then
            echo "::error::producer checkout is at $ACTUAL but the pin says $PRODUCER_REF — the"                  "seal would measure one producer and report another. Not a flake."
            exit 1
          fi

          test -d ../invincible-agent/policy/task_kinds
          test -d ../invincible-agent/policy/overlays/sample/task_kinds
          echo "producer seed declarations:    $(ls ../invincible-agent/policy/task_kinds | wc -l)"
          echo "producer overlay declarations: $(ls ../invincible-agent/policy/overlays/sample/task_kinds | wc -l)"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # THE FULL GATE, with the producer present — so the parity seal actually executes. It runs
      # BEFORE the image build, and a failure here means no image is produced, which is the same
      # contract the old in-container build had and the reason this is not a weakening.
      - name: Transport declaration check
        run: npm run check:transport

      # ⛔ THE COUNT IS CITED WITH ITS CONCURRENCY, or it is a number without conditions.
      #
      # ⛔ THE COUNT IS PRINTED WITH ITS CONCURRENCY, so an OOM NAMES ITSELF.
      #
      # This suite dies with "JavaScript heap out of memory" on one developer machine and then
      # reports a VARYING total, because workers die mid-run. It exits nonzero rather than
      # silently passing, so it is not a hollow green — but a cited count means nothing without
      # the conditions it ran under, which is why they are echoed below.
      #
      # ⛔ AND BOUNDING THE WORKERS WAS TRIED AND DOES NOT FIX IT. Measured rather than assumed,
      # after TWO earlier "stable and repeatable" claims that were each one lucky run:
      #
      #   default, 4GB heap   1030 / 1494 / 1494     26 errors then clean
      #   2 workers           1337 / 1441 / 1494      7 errors
      #   1 worker            1494 / 1494 / 1469      1 error
      #
      # Every setting fails sometimes, so the cause is the machine and not the concurrency. CI
      # meanwhile is clean at DEFAULT on every run — 1480, 1491, 1494, each matching its
      # commit, zero errors. Pinning a worker count here would slow a runner that does not need
      # it while fixing nothing locally, so it is deliberately NOT pinned.
      #
      # If CI's headroom ever goes, the echoes below are what make the failure read as a
      # resource limit rather than as a code regression — which is the shape that gets a real
      # red retried away.
      - name: Test suite, with the producer present
        env:
          # Named in the seal's own assertion messages, so a parity red says which producer
          # state it was measured against instead of leaving the reader to guess.
          CORTEX_PRODUCER_REF: ${{ env.PRODUCER_REF }}
        run: |
          # REPORTED, NOT ASSERTED. An earlier version of this line said "workers: 1 (pinned)"
          # after the pin was removed — a hardcoded claim about configuration, in the step added
          # to stop counts being cited without their conditions. `nproc` is read from the
          # runner; the worker count is vitest's default and is stated as such rather than
          # named, because naming a number here is how it goes stale.
          echo "runner cores:      $(nproc)"
          echo "vitest maxWorkers: (unset — vitest default, derived from cores)"
          echo "node heap limit:   $(node -e 'console.log(require("v8").getHeapStatistics().heap_size_limit / 1048576 + " MB")')"
          npm run test

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Set up pack CLI
        uses: buildpacks/github-actions/setup-pack@v5.7.4

      # ── Multi-arch enablement ──
      # The arm64 k3s sandbox at home wouldn't pull the previous amd64-
      # only image, so the cluster's helm values had `cortexUi.enabled:
      # false`. QEMU + Buildx makes one image that runs on both arm64
      # and amd64. The build images (node:20-alpine, nginx:1.25-alpine)
      # are already multi-arch on Docker Hub so the build itself "just
      # works" once buildx is told to produce both.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image tags
        id: tag
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            PRIMARY="${{ github.ref_name }}"
          else
            PRIMARY="${{ github.sha }}"
          fi
          {
            echo "tag=${PRIMARY}"
            # On master, also tag :latest in the same buildx run.
            # Single-step tagging produces a proper multi-arch
            # manifest; the old "pull-then-retag-then-push" pattern
            # doesn't work for multi-arch — it would have collapsed
            # the manifest list to whichever arch the runner is on.
            if [[ "${{ github.ref }}" == "refs/heads/master" && "${{ github.event_name }}" != "pull_request" ]]; then
              echo "tags=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:${PRIMARY},${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:latest"
            else
              echo "tags=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:${PRIMARY}"
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Build and push frontend image (multi-arch)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tag.outputs.tags }}
