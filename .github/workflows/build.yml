# ──────────────────────────────────────────────────────────
# The Cortex — Build & Push Container Images (Buildpacks)
# ──────────────────────────────────────────────────────────
# Triggers on push to main or any tag starting with 'v'.
# Builds the cortex-frontend image using Cloud Native Buildpacks (pack CLI):
# Pushes to GitHub Container Registry (ghcr.io).

name: Build Containers

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}
  # ⛔ THE PRODUCER SHA, DECLARED ONCE. It is needed in two places — the checkout `ref` and the
  # env the seal reads to print its baseline — and carrying it twice is the same
  # two-declarations-of-one-fact defect this repo found three times today, once in its own type
  # system. Two literals that must agree, with nothing checking that they do, is how the seal
  # ends up measuring one producer and REPORTING another.
  #
  # Bump HERE and nowhere else.
  PRODUCER_REF: c0005142a610bc7759cfc8953666aee7c6064632

permissions:
  contents: read
  packages: write

jobs:
  # ── Does this diff need an image at all? ──────────────────────────────
  #
  # WHY THIS JOB EXISTS, MEASURED, AND AT ITS SECOND OCCURRENCE: a
  # sessions-only push builds a full multi-arch image and RETAGS `:latest`
  # onto it. That is not merely wasted wall clock — it silently moves
  # `:latest` off a digest a human has already accepted. It happened at
  # `8a13dd6` (reported in `4c0375b`), and it happened again on
  # 2026-09-23 when `ea060f3..a6950b2` moved `:latest` off `38cda6c8`
  # while roll #2 was carrying that digest. Twice is a property of the
  # pipeline, not an accident, so it gets a gate rather than another
  # report. Modelled on doc-tools PR #7 (`f89720e`).
  #
  # GitHub Actions has no job-level `paths-ignore` — it exists only on the
  # workflow `on:` trigger, and putting it there would skip the transport
  # guard, the test suite and the parity seal as well, which are worth
  # their minutes on ANY diff. So the verdict is computed here by hand
  # with a plain `git diff` and consumed by `if:` on the image-build STEPS
  # below. Deliberately not dorny/paths-filter: the point is a single
  # auditable `git diff` this file's reader can verify by eye.
  #
  # ⛔ WHERE THE GATE LANDS, AND WHY IT IS NOT ON THE JOB. cortex-ui has
  # ONE job, not doc-tools' three, so a job-level `if:` would skip the
  # seals along with the build. This file already documents what that
  # costs: read the `frontend` job's header — the parity seal "had NEVER
  # run in CI", silently skipping 28 assertions while every build appeared
  # green. A gate that quietly stops a seal from running is the same
  # incident wearing a different hat. So `changes` decides ONLY whether an
  # image gets built; check:transport, the suite, and tsc run on every
  # push including a sessions-only one. A skipped build shows in the log
  # as skipped rather than absent.
  #
  # ⛔ THE ALLOWLIST IS `^sessions/` AND `^docs/`, AND `helm/` MUST NEVER
  # JOIN IT. Read this before adding anything. The list is an ALLOWLIST of
  # paths that PROVABLY cannot reach the image — not a denylist of things
  # that feel unlike code. The proof for these two, measured on 2026-09-23
  # rather than assumed: nothing under `src/`, `tests/` or `scripts/`
  # imports, reads or fetches a path under `docs/` or `sessions/` — every
  # single reference is a prose citation inside a comment — and the
  # Dockerfile's final stage copies only `/app/dist`, `nginx.conf` and
  # `docker-entrypoint.sh`, naming neither directory. `helm/` fails that
  # test outright and is the exact analogue of the `charts/` warning in
  # doc-tools PR #7: a values file is not code, it is what DEPLOYS, and it
  # carries the image pin. A helm-only diff is the one that most needs the
  # image it references to exist.
  #
  # FAILS OPEN, ALWAYS. The only acceptable failure mode is "code=true,
  # build anyway" — a wasted build. The unacceptable one is a real change
  # reaching master with no image, which reads as shipped while existing
  # nowhere. So every branch that cannot POSITIVELY PROVE "every changed
  # path matches ^sessions/ or ^docs/" falls through to the code=true this
  # step starts with: a non-push/pull_request event, a tag push, an
  # all-zeros `before` sha (new branch or force-push rewrite), a base or
  # head commit this checkout cannot find, a failed `git diff`, or an
  # EMPTY diff — zero changed paths is proof the computation should be
  # distrusted, not proof nothing needs building. None of those gets its
  # own escape hatch; they collapse into one default, so there is exactly
  # one way to reach code=false and no way for a new edge case to invent a
  #
  # ⛔ REDPROOF — THIS GATE WAS PROVEN ABLE TO RETURN BOTH ANSWERS. A guard
  # that can only ever say "build" is not a guard, it is a comment. Run the
  # decide step directly against real shas in this repo:
  #
  #     npx -y js-yaml .github/workflows/build.yml > wf.json
  #     node -e 'const d=require("./wf.json");require("fs").writeFileSync(
  #       "decide.sh", d.jobs.changes.steps.find(x=>x.id==="decide").run)'
  #     EVENT_NAME=push IS_TAG=false BASE_SHA=197609git rev-parse <A>) 
  #       HEAD_SHA=197609git rev-parse <B>) GITHUB_OUTPUT=out.txt bash decide.sh
  #
  # Measured 2026-09-23, ten cases, all as predicted:
  #
  #     a6950b2..e1e1fa4   sessions-only            code=FALSE   <- the point
  #     7b3afbd            one sessions/ commit     code=FALSE
  #     ea060f3..a6950b2   range containing src/    code=true
  #     091b26c            one src/ commit          code=true
  #     a6950b2..e1e1fa4   as a TAG push            code=true
  #     all-zeros base                              code=true
  #     base sha not in checkout                    code=true
  #     empty diff (head == base)                   code=true
  #     workflow_dispatch, same sessions-only diff  code=true
  #     empty base sha                              code=true
  #
  # THE FIRST ROW IS THE MEASUREMENT, NOT THE DESIGN: `a6950b2..e1e1fa4` is
  # the exact push that moved `:latest` off the accepted `38cda6c8`. Had this
  # gate existed that morning, it would not have. Re-run this table if you
  # touch the decide step; a green that only ever came back `true` would look
  # identical to this one in the checks list.
  changes:
    name: Does this diff need an image?
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.decide.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether this diff can skip the image build
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          # Deliberately NOT `set -e`: a git failure below must fall through to
          # the CODE=true default already set, not abort the step before that
          # default is written to GITHUB_OUTPUT.
          set -uo pipefail

          CODE=true

          if [ "$EVENT_NAME" != "pull_request" ] && [ "$EVENT_NAME" != "push" ]; then
            echo "event is '$EVENT_NAME', no diff range applies -> code=true"
          elif [ "$IS_TAG" = "true" ]; then
            echo "tag push -> code=true unconditionally, a release build is never worth a heuristic"
          elif [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "no usable base sha (new branch / force-push rewrite) -> code=true"
          elif ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "base sha $BASE_SHA not found in this checkout -> code=true"
          elif ! git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null; then
            echo "head sha $HEAD_SHA not found in this checkout -> code=true"
          else
            # THREE dots, not two. `git diff A B` compares the two trees
            # directly, so if master moved ahead after a PR was cut, every
            # commit master gained shows up as a REVERSE change attributed to
            # this diff. `A...B` diffs against the merge base, which is the
            # question actually being asked. The two-dot form fails safe — the
            # spurious paths read as "not sessions/docs" and the build runs —
            # but it makes the skip fire almost never, which is the feature
            # silently not working.
            CHANGED=$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}")
            STATUS=$?
            if [ $STATUS -ne 0 ]; then
              echo "git diff exited $STATUS -> code=true"
            elif [ -z "$CHANGED" ]; then
              echo "diff came back empty -> code=true (not proof of docs-only, just proof to distrust)"
            elif echo "$CHANGED" | grep -qvE '^(sessions|docs)/'; then
              echo "at least one changed path is outside sessions/ and docs/ -> code=true"
              echo "$CHANGED"
            else
              CODE=false
              echo "every changed path matches ^sessions/ or ^docs/ -> code=false, no image, :latest stays put"
              echo "$CHANGED"
            fi
          fi

          echo "code=$CODE" >> "$GITHUB_OUTPUT"

  # ── Frontend ──────────────────────────────────────────────
  frontend:
    name: Build Frontend
    # `needs` is required here purely so the steps below can READ
    # `needs.changes.outputs.code` — another job's outputs are only visible to a
    # job that lists it. It is NOT a correctness gate: `changes` never fails on
    # purpose. Note there is deliberately no job-level `if:` — see the `changes`
    # job header for why the seals in this job must run on every diff.
    needs: changes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── THE GATE LIVES HERE, NOT IN THE CONTAINER ──────────────────────
      #
      # The task-kind parity seal compares cortex's rendering against the PRODUCER's declared
      # task kinds, which means it needs two repos on one filesystem. `docker build` gets one
      # (`COPY . .`), which is the point of a hermetic context — so the seal could never run
      # there, and when a skipped seal was correctly made red, no image could be built at all.
      #
      # ⛔ AND IT HAD NEVER RUN IN CI. A single `actions/checkout` meant the producer was absent
      # on every build since the seal landed, so all 28 parity assertions silently skipped and
      # every green build appeared to carry coverage it did not have. The red that broke the
      # image did not introduce that; it revealed it, in the only place loud enough to notice.
      #
      # So the producer is checked out BESIDE cortex-ui and the suite runs in this job.
      - name: Check out the producer beside cortex-ui
        uses: actions/checkout@v4
        with:
          repository: edgy-solutions/invincible-agent
          # PINNED, AND THE SEAL PRINTS IT. A moving `master` makes a parity red
          # unattributable — nobody can tell whether cortex changed or the producer did. Pinned
          # to the sha THE FLEET IS ACTUALLY SERVING, read off the deployed image tag
          # (`ghcr.io/.../cortex-bff:9ede76c…`) rather than from anyone's branch, because merged
          # and served are different facts and this seal is about the deployed contract.
          #
          # ⛔ WHICH COMPONENT'S SHA THIS IS, because the producer repo is deployed at MORE THAN
          # ONE at a time. Measured 2026-09-15 in the sandbox:
          #
          #   iagent-cortex-bff   cortex-bff:cfa3f0d…   serves the DECLARATIONS this seal reads
          #   iagent-projector    cortex-bff:cfa3f0d…   writes answer_artifact_projection
          #
          # RE-MEASURED FROM THE PODS 2026-09-19 (the roll that took cortex-ui to revision 147).
          # Both halves are on ONE sha again, and it is the sha this pin now names:
          #
          #   iagent-cortex-bff   cortex-bff:c0005142…
          #   iagent-projector    cortex-bff:c0005142…
          #
          # ⛔ AND THE WHOLE FLEET IS UNIFORM ON IT — every `invincible-agent/*` image in the
          # namespace is c0005142, checked by filtering for anything that ISN'T and getting an
          # empty list. So the open question below ("which component's sha is this") does not
          # have to be answered to make THIS bump: the two candidate answers are the same string
          # today. That is a coincidence again, and it is recorded as one.
          #
          # The bump also ARMS R-073: `unsummarised` exists on both sides only at cfa3f0d or
          # later, so `dispositionJoin.test.ts` — the term's retirement mechanism — could not
          # land until this moved. It lands with it, which is what the ruling asked for.
          #
          # THE OPEN QUESTION THIS MAKES LIVE — do not resolve it by bumping. The seal reads
          # `policy/task_kinds`, which the BFF serves, so on one reading the pin should follow the
          # bff and be ca3a38f today. But a seal over artifact FIELDS would belong to the
          # PROJECTOR, still at 3830de1. Bumping now would quietly settle "this pin means the
          # task-kind producer" without anyone having decided it, so it stays put until someone
          # does.
          #
          # HELD SAFELY, AND THAT IS MEASURED RATHER THAN ASSUMED: `git diff 3830de1 ca3a38f`
          # touches five files — direct_dispatch.py, gateway.py, graph_host/main.py and two
          # tests — and NOTHING under `policy/task_kinds` or the sample overlay. So the seal's
          # result is identical either way.
          #
          # ⛔ AND THE EARLIER "they agree" NOTE HAS NOW BEEN ASKED ITS QUESTION AND HELD BY
          # CONTENT, NOT BY THE PODS AGREEING. It was recorded as a coincidence precisely because
          # correct-by-accident and correct-by-construction read identically at the moment you
          # look. The pods have since diverged and the seal is still right — which is the
          # coincidence holding for a DIFFERENT reason than the one that made it look safe.
          # If a future bff roll touches the declarations, this stops being free and the pin's
          # meaning must be decided before it is moved.
          #
          # HISTORY: they were also split when this pin was first set — bff at 9ede76c,
          # seventeen other services at 280e6103 — and the producer lane's own pre-roll census
          # exited 1 over it, flagging the bff as AHEAD of record. The 2026-09-15 roll pinned
          # everything via `global.imageTag` and closed that one.
          #
          # One repo, two live versions, and "the producer" names neither on its own. The
          # projector is the one that writes `answer_artifact_projection`, which is what cortex
          # consumes over Electric, so for ARTIFACT SHAPE it is arguably the more relevant half.
          # The pin follows the BFF because the task-kind declarations this seal reads are served
          # by it. The two currently agree on `policy/task_kinds` and the sample overlay — a
          # `git diff` between them over those paths is EMPTY — so the choice does not change the
          # result today. That is a coincidence and not a guarantee: if they diverge, this pin
          # must name which contract is being sealed rather than silently tracking one.
          #
          # NOT THE FRONTEND. cortex-ui's own deployment used to be `frontend:latest` with
          # pullPolicy Always and no sha tag. ⚠ THAT CHANGED 2026-09-19 and the line is corrected
          # rather than deleted, because the old shape is why several earlier notes here reason
          # about `:latest` moving: the deployment now runs a DIGEST —
          # `frontend@sha256:c8d6553f…` — read from the pod tonight. A digest cannot drift under
          # a restart, so the hazard those notes describe is closed for this surface.
          # The served bundle still self-reports `git_sha` in /version.json, which is what makes
          # the digest attributable to a commit.
          #
          # ── THE BUMP PROCEDURE: THREE CHECKS, AND THE THIRD ONE WAS REWRITTEN ─────────
          #
          # Bump deliberately. A parity red after a bump is a real finding about drift between
          # the two repos; it is not a flake and must not be retried away.
          #
          #   1. READ THE DEPLOYED SHA FROM THE POD, never from a note or a branch:
          #        kubectl get pods -n sandbox -o custom-columns=NAME:.metadata.name,IMAGE:.spec.containers[*].image
          #      Read BOTH iagent-cortex-bff and iagent-projector, and check nothing else in the
          #      fleet is on a different sha — a uniform fleet is what makes one pin meaningful.
          #
          #   2. THE DECLARATION DIFF, ruled to matter above all:
          #        git -C ../invincible-agent diff <old> <new> -- policy/task_kinds policy/overlays/sample/task_kinds
          #      EMPTY means the bump cannot change the seal's result. Non-empty is a FINDING,
          #      not a formality. ⛔ Run the same diff WITHOUT the pathspec as a control: an empty
          #      filtered diff and a bad sha look identical.
          #
          #   3. ⛔ THE LEDGER VOCABULARY — AND THIS CHECK NOW READS THE SDK, NOT THE PRODUCER.
          #
          #      AS PREVIOUSLY WRITTEN IT SAID: "confirm `reachable_for` / `ROW_DISPOSITIONS`
          #      have not moved" — in the PRODUCER, at PRODUCER_REF. They have moved. They live
          #      in the `iagent-mesh` SDK (`iagent_mesh/rows.py`) and no longer in
          #      `agent_fleet/graph_host/rows.py`. So the check as written reads a location that
          #      cannot contain the thing, finds it absent every time, and reports nothing —
          #      A CHECK THAT CAN NO LONGER FAIL. Bumping the pin while leaving it in place
          #      re-arms a guard with no arm, which is worse than having none, because the
          #      procedure still LOOKS three checks deep.
          #
          #      Measured: `rows.py` is PRESENT in iagent_mesh 0.9.3 and ABSENT in 0.9.2 — the
          #      vocabulary entered the SDK ONE MINOR VERSION AGO. So an SDK bump is a live
          #      mechanism for these terms to move while PRODUCER_REF sees nothing at all.
          #
          #      THE REWRITTEN CHECK — read the SDK rev the producer pins AT THE NEW SHA:
          #        git -C ../invincible-agent show <new>:uv.lock | grep 'name = "iagent-mesh"'
          #      then confirm that rev's `ROW_DISPOSITIONS` / `HOLE_DISPOSITIONS` / `reachable_for`
          #      still match cortex's `LEDGER_DISPOSITIONS` / `LEDGER_HOLE_DISPOSITIONS` in
          #      `src/components/ledger/SourceLedger.contract.ts`. Read them by IMPORTING the
          #      installed wheel, and prove the wheel IS the pin first (`direct_url.json`'s commit
          #      against the `uv.lock` rev) — a grep that returns nothing is a claim about the
          #      grep.
          #
          #      At c0005142 the SDK rev is `v0.9.3` and the sets are IDENTICAL, verified
          #      2026-09-19. ⚠ That is a fact about today measured against a wheel one minor old,
          #      NOT a guarantee. If the producer's uv.lock moves iagent-mesh, this check is the
          #      one that has to run again — PRODUCER_REF alone will not notice.
          #
          #   THE FOURTH THING, which is not a check but the gate: `npm run build`, which is what
          #   CI runs below.
          #
          # ⛔ AND ON RUNNING THE SEAL BY HAND: use the DECLARED form,
          #   `CORTEX_PRODUCER_REF=<sha> npm run test -- src/lib/taskKindParity.test.tsx`.
          # `npx vitest run <file>` FAILS TO COLLECT this file under vitest 4 —
          # "Cannot read properties of undefined (reading 'config')" at the `describe.skipIf` —
          # which is a FALSE RED on the seal, and exactly the shape that gets a real red retried
          # away later. Measured 2026-09-19.
          #
          # ⛔ AND CORTEX_PRODUCER_REF IS A LABEL, NOT A SELECTOR. It only feeds assertion
          # messages; the seal reads ../invincible-agent off the disk at whatever that checkout
          # is standing on. Establish the baseline with `git -C ../invincible-agent rev-parse HEAD`
          # BEFORE trusting any local run — the checkout is shared and moves mid-session.
          ref: ${{ env.PRODUCER_REF }}
          path: _producer
          persist-credentials: false

      # `actions/checkout` refuses any `path` outside GITHUB_WORKSPACE, and the seal resolves
      # the producer as a SIBLING of the cortex-ui checkout root. So it lands in-workspace and is
      # moved one level up. The seal needs only `policy/task_kinds` and the sample overlay — no
      # git history — so a plain move is sufficient.
      - name: Put the producer where the seal looks for it
        run: |
          set -euo pipefail
          mv _producer ../invincible-agent

          # ⛔ ASSERT THE BASELINE, because a GREEN RUN OTHERWISE PROVES NOTHING ABOUT IT. The
          # seal names its producer only in an assertion MESSAGE, which appears on failure — so
          # if `PRODUCER_REF` ever resolved to empty, checkout would silently fall back to the
          # default branch, the counts below would still print, the suite would still pass, and
          # the seal would be measuring master while this file claimed a pin. That is the same
          # "measures one producer, reports another" failure as two literals drifting, reached
          # through a different door: a claim nothing could contradict.
          ACTUAL="$(git -C ../invincible-agent rev-parse HEAD)"
          echo "producer HEAD: $ACTUAL"
          echo "pinned ref:    $PRODUCER_REF"
          if [ "$ACTUAL" != "$PRODUCER_REF" ]; then
            echo "::error::producer checkout is at $ACTUAL but the pin says $PRODUCER_REF — the"                  "seal would measure one producer and report another. Not a flake."
            exit 1
          fi

          test -d ../invincible-agent/policy/task_kinds
          test -d ../invincible-agent/policy/overlays/sample/task_kinds
          echo "producer seed declarations:    $(ls ../invincible-agent/policy/task_kinds | wc -l)"
          echo "producer overlay declarations: $(ls ../invincible-agent/policy/overlays/sample/task_kinds | wc -l)"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # THE FULL GATE, with the producer present — so the parity seal actually executes. It runs
      # BEFORE the image build, and a failure here means no image is produced, which is the same
      # contract the old in-container build had and the reason this is not a weakening.
      - name: Transport declaration check
        run: npm run check:transport

      # ⛔ THE COUNT IS CITED WITH ITS CONCURRENCY, or it is a number without conditions.
      #
      # ⛔ THE COUNT IS PRINTED WITH ITS CONCURRENCY, so an OOM NAMES ITSELF.
      #
      # This suite dies with "JavaScript heap out of memory" on one developer machine and then
      # reports a VARYING total, because workers die mid-run. It exits nonzero rather than
      # silently passing, so it is not a hollow green — but a cited count means nothing without
      # the conditions it ran under, which is why they are echoed below.
      #
      # ⛔ AND BOUNDING THE WORKERS WAS TRIED AND DOES NOT FIX IT. Measured rather than assumed,
      # after TWO earlier "stable and repeatable" claims that were each one lucky run:
      #
      #   default, 4GB heap   1030 / 1494 / 1494     26 errors then clean
      #   2 workers           1337 / 1441 / 1494      7 errors
      #   1 worker            1494 / 1494 / 1469      1 error
      #
      # Every setting fails sometimes, so the cause is the machine and not the concurrency. CI
      # meanwhile is clean at DEFAULT on every run — 1480, 1491, 1494, each matching its
      # commit, zero errors. Pinning a worker count here would slow a runner that does not need
      # it while fixing nothing locally, so it is deliberately NOT pinned.
      #
      # If CI's headroom ever goes, the echoes below are what make the failure read as a
      # resource limit rather than as a code regression — which is the shape that gets a real
      # red retried away.
      - name: Test suite, with the producer present
        env:
          # Named in the seal's own assertion messages, so a parity red says which producer
          # state it was measured against instead of leaving the reader to guess.
          CORTEX_PRODUCER_REF: ${{ env.PRODUCER_REF }}
        run: |
          # REPORTED, NOT ASSERTED. An earlier version of this line said "workers: 1 (pinned)"
          # after the pin was removed — a hardcoded claim about configuration, in the step added
          # to stop counts being cited without their conditions. `nproc` is read from the
          # runner; the worker count is vitest's default and is stated as such rather than
          # named, because naming a number here is how it goes stale.
          echo "runner cores:      $(nproc)"
          echo "vitest maxWorkers: (unset — vitest default, derived from cores)"
          echo "node heap limit:   $(node -e 'console.log(require("v8").getHeapStatistics().heap_size_limit / 1048576 + " MB")')"
          npm run test

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Set up pack CLI
        if: needs.changes.outputs.code == 'true'
        uses: buildpacks/github-actions/setup-pack@v5.7.4

      # ── Multi-arch enablement ──
      # The arm64 k3s sandbox at home wouldn't pull the previous amd64-
      # only image, so the cluster's helm values had `cortexUi.enabled:
      # false`. QEMU + Buildx makes one image that runs on both arm64
      # and amd64. The build images (node:20-alpine, nginx:1.25-alpine)
      # are already multi-arch on Docker Hub so the build itself "just
      # works" once buildx is told to produce both.
      - name: Set up QEMU
        if: needs.changes.outputs.code == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: needs.changes.outputs.code == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && needs.changes.outputs.code == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image tags
        if: needs.changes.outputs.code == 'true'
        id: tag
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            PRIMARY="${{ github.ref_name }}"
          else
            PRIMARY="${{ github.sha }}"
          fi
          {
            echo "tag=${PRIMARY}"
            # On master, also tag :latest in the same buildx run.
            # Single-step tagging produces a proper multi-arch
            # manifest; the old "pull-then-retag-then-push" pattern
            # doesn't work for multi-arch — it would have collapsed
            # the manifest list to whichever arch the runner is on.
            if [[ "${{ github.ref }}" == "refs/heads/master" && "${{ github.event_name }}" != "pull_request" ]]; then
              echo "tags=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:${PRIMARY},${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:latest"
            else
              echo "tags=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:${PRIMARY}"
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Build and push frontend image (multi-arch)
        if: needs.changes.outputs.code == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tag.outputs.tags }}
